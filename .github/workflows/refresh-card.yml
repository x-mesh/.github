name: refresh card

# The card reports a measured number, so it has to be re-measured rather than
# remembered. The README used to carry that number by hand and it went stale
# within a day.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/card.json"
      - ".github/workflows/refresh-card.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes github:x-mesh/card render --config profile/card.json --template terminal --out profile/assets/layers.svg
          npx --yes github:x-mesh/card render --config profile/card.json --template terminal --dark --out profile/assets/layers.dark.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- profile/assets; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets
          git commit -m "chore: refresh layers card"
          git push

