name: refresh activity

# Commits and merged pull requests per month, across every repository in the
# org including private ones. GITHUB_TOKEN only sees this repository, so the
# count needs ACTIVITY_TOKEN: a fine-grained token, resource owner x-mesh, all
# repositories, read-only Contents and Pull requests.

on:
  schedule:
    - cron: "37 6 * * *" # daily, 06:37 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/activity.mjs"
      - ".github/workflows/refresh-activity.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Measure and render
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: node .github/scripts/activity.mjs

      - name: Commit if changed
        run: |
          # status, not diff: on the first run the outputs are untracked files.
          if [ -z "$(git status --porcelain -- profile/assets profile/activity.json)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets profile/activity.json
          git commit -m "chore: refresh activity chart"
          git push
